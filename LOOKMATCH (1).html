<style>
/* Layout: coluna de app para iPhone (max 440px), vidro sobre azul-noite, navegação em pílula na base. */
:root{
  color-scheme:dark;
  --bg:#080B12; --bg2:#0D121C;
  --glass:rgba(255,255,255,.055); --glass2:rgba(255,255,255,.09);
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.17);
  --fg:#E8ECF4; --muted:#8C96AA; --dim:#69738A;
  --accent:#5B9BFF; --accent2:#9DC0FF; --accent-strong:#2F6FE4;
  --accent-soft:rgba(91,155,255,.16); --accent-line:rgba(91,155,255,.45);
  --ok:#43D49A; --warn:#EDB84D; --bad:#EE6A66;
  --ok-soft:rgba(67,212,154,.13); --warn-soft:rgba(237,184,77,.13); --bad-soft:rgba(238,106,102,.14);
  --font-display:'Instrument Serif',Georgia,serif;
  --font-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background-color:var(--bg);
  background-image:radial-gradient(120% 55% at 0% 0%,rgba(91,155,255,.20),transparent 62%),radial-gradient(90% 45% at 100% 100%,rgba(91,155,255,.10),transparent 60%);
  background-attachment:fixed;color:var(--fg);font:14px/1.45 var(--font-body);display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
.app{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;gap:10px;min-width:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 12px}
@media(min-width:700px){.app{height:min(100%,880px);margin-block:auto;border:1px solid var(--line);border-radius:38px;background:rgba(255,255,255,.02);padding-inline:20px}}
.screen{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none;padding:6px 0 18px}
.screen::-webkit-scrollbar{display:none}
.flow{display:flex;flex-direction:column;gap:14px;min-width:0}
.flow>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.flow>*:nth-child(2){animation-delay:.04s}.flow>*:nth-child(3){animation-delay:.08s}.flow>*:nth-child(4){animation-delay:.12s}.flow>*:nth-child(5){animation-delay:.16s}.flow>*:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0}
.display{font-family:var(--font-display);font-weight:400;font-size:36px;line-height:1.04;letter-spacing:-.01em;margin:4px 0 0;text-wrap:balance}
.display em{color:var(--accent2)}
.h2{font-family:var(--font-display);font-weight:400;font-size:24px;line-height:1.1;margin:0;text-wrap:balance}
.muted{color:var(--muted)}.small{font-size:12px}
.row{display:flex;align-items:center;gap:12px;min-width:0}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.card{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);min-width:0}
.card.hero{background:linear-gradient(160deg,rgba(91,155,255,.16),rgba(255,255,255,.04));border-color:var(--accent-line)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:12px 0 0}
.kv dt{color:var(--muted);font-size:12px}.kv dd{margin:0;font-weight:600;text-align:right;min-width:0}
.link{appearance:none;background:none;border:0;color:var(--accent);font:700 12px var(--font-body);cursor:pointer;padding:6px 0}
.btn{appearance:none;border:1px solid var(--line2);background:var(--glass);color:var(--fg);font:700 13px var(--font-body);padding:12px 16px;min-height:44px;border-radius:14px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;justify-content:center;transition:transform .15s,background .2s,border-color .2s}
.btn:hover{background:var(--glass2)}.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent-strong);border-color:transparent;color:#fff}.btn.primary:hover{background:#3F7DF0}
.btn.danger{color:var(--bad);border-color:rgba(238,106,102,.4)}
.btn:disabled{opacity:.45;cursor:default}
.btn.block{width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font:700 11px var(--font-body);border:1px solid;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok);background:var(--ok-soft);border-color:rgba(67,212,154,.3)}
.pill.warn{color:var(--warn);background:var(--warn-soft);border-color:rgba(237,184,77,.3)}
.pill.bad{color:var(--bad);background:var(--bad-soft);border-color:rgba(238,106,102,.32)}
.pill.acc{color:var(--accent2);background:var(--accent-soft);border-color:var(--accent-line)}
.pill.mute{color:var(--muted);background:var(--glass);border-color:var(--line)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{appearance:none;flex:none;border:1px solid var(--line);background:var(--glass);color:var(--muted);font:600 12.5px var(--font-body);padding:9px 13px;min-height:38px;border-radius:999px;cursor:pointer;transition:all .2s}
.chip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent2)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:4px;gap:4px}
.seg button{appearance:none;border:0;background:none;color:var(--muted);font:700 13px var(--font-body);min-height:40px;border-radius:12px;cursor:pointer;transition:all .2s}
.seg button[aria-selected=true]{background:var(--accent-strong);color:#fff}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:12px;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{width:100%;min-width:0;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--fg);font:500 14px var(--font-body);padding:11px 12px;min-height:44px;border-radius:12px}
.field select option{background:#12182A;color:var(--fg)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;appearance:none;background:none;border:0;color:var(--fg);font:600 13px var(--font-body);text-align:left;padding:4px 0;cursor:pointer}
.switch i{flex:none;width:44px;height:26px;border-radius:99px;background:var(--glass2);border:1px solid var(--line2);position:relative;transition:background .2s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:all .2s}
.switch[aria-checked=true] i{background:var(--accent-strong);border-color:transparent}
.switch[aria-checked=true] i::after{left:21px;background:#fff}
/* tabbar */
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:6px;border-radius:26px;background:rgba(18,24,40,.74);border:1px solid var(--line2);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%)}
.tabbar button{appearance:none;border:0;background:none;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 7px;min-height:52px;border-radius:20px;cursor:pointer;font:700 10.5px var(--font-body);transition:all .25s}
.tabbar button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current=page]{color:var(--accent2);background:var(--accent-soft)}
/* closet */
.tile{appearance:none;text-align:left;color:inherit;font:inherit;background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:10px;display:flex;flex-direction:column;gap:8px;cursor:pointer;min-width:0;transition:transform .2s,border-color .2s}
.tile:hover{border-color:var(--line2);transform:translateY(-2px)}
.tile .art{aspect-ratio:1/1;border-radius:14px;background:radial-gradient(70% 70% at 50% 40%,rgba(255,255,255,.10),rgba(255,255,255,.02));display:flex;align-items:center;justify-content:center;overflow:hidden}
.tile .art svg{width:78%;height:78%}.tile .art img{width:100%;height:100%;object-fit:cover}
.tile .name{font-weight:700;font-size:13px;line-height:1.25;display:block}
.tile .sub{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:2px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;border:1px solid rgba(255,255,255,.3);flex:none}
/* deck */
.deck{position:relative;height:clamp(430px,60vh,530px)}
.swipe-card{position:absolute;inset:0;border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.04));border:1px solid var(--line2);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:14px;display:flex;flex-direction:column;gap:8px;touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .3s;box-shadow:0 22px 50px rgba(0,0,0,.45)}
.swipe-card.back{transform:scale(.94) translateY(14px);opacity:.5;pointer-events:none}
.swipe-card .art{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;border-radius:20px;background:radial-gradient(70% 60% at 50% 40%,rgba(255,255,255,.09),transparent 72%)}
.swipe-card .art svg{height:100%;width:auto;max-width:100%}
.stamp{position:absolute;top:56px;padding:5px 12px;border:2px solid;border-radius:10px;font:800 15px var(--font-body);letter-spacing:.12em;opacity:0;pointer-events:none}
.stamp.like{left:16px;color:var(--ok);transform:rotate(-9deg)}.stamp.nope{right:16px;color:var(--bad);transform:rotate(9deg)}
.actions{display:flex;justify-content:center;gap:14px;align-items:center;margin-top:14px}
.round{appearance:none;width:52px;height:52px;border-radius:50%;border:1px solid var(--line2);background:var(--glass);color:var(--fg);display:grid;place-items:center;cursor:pointer;transition:transform .15s,background .2s}
.round:active{transform:scale(.92)}.round.big{width:64px;height:64px}
.round svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.round.yes{color:var(--ok);border-color:rgba(67,212,154,.45);background:var(--ok-soft)}
.round.no{color:var(--bad);border-color:rgba(238,106,102,.45);background:var(--bad-soft)}
/* analysis */
.bars{display:flex;flex-direction:column;gap:10px}
.bl{display:flex;justify-content:space-between;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.track{height:6px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;margin:5px 0 3px}
.track i{display:block;height:100%;border-radius:9px;background:var(--accent);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.track i.warn{background:var(--warn)}.track i.bad{background:var(--bad)}
.bar small{color:var(--dim);font-size:11.5px}
.reasons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.reasons li{padding-left:18px;position:relative;font-size:13px;line-height:1.4}
.reasons li::before{content:"";position:absolute;left:0;top:6px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.reasons li.ok::before{background:var(--ok)}.reasons li.warn::before{background:var(--warn)}.reasons li.bad::before{background:var(--bad)}.reasons li.info::before{background:var(--dim)}
.ring text{font:400 22px var(--font-display);fill:var(--fg);text-anchor:middle;dominant-baseline:central}
/* picker */
.prow{display:flex;flex-direction:column;gap:8px}
.hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.hscroll::-webkit-scrollbar{display:none}
.ptile{appearance:none;flex:none;width:82px;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:8px 6px;color:var(--muted);font:600 10.5px/1.25 var(--font-body);display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;transition:all .2s}
.ptile svg{width:42px;height:42px}
.ptile span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-align:center}
.ptile[aria-pressed=true]{border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent2)}
.compwrap{display:flex;justify-content:center;border-radius:20px;background:radial-gradient(70% 60% at 50% 40%,rgba(255,255,255,.09),transparent 72%);padding:6px}
.compwrap svg{width:100%;max-width:230px;height:auto}
.note{font-size:12px;color:var(--muted);line-height:1.45;padding:10px 12px;border-radius:12px;background:var(--glass);border:1px dashed var(--line2)}
.favitem{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}
.favitem .th{border-radius:14px;background:rgba(255,255,255,.04);padding:4px}
.favitem .th svg{width:100%;height:auto;display:block}
.photoprev{width:100%;max-height:200px;object-fit:cover;border-radius:16px;border:1px solid var(--line)}
.legend{display:grid;gap:8px}
.legend div{display:flex;gap:10px;align-items:flex-start;font-size:12.5px}
/* sheet + toast */
.overlay[hidden]{display:none}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(3,5,10,.62);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:460px;max-height:88%;overflow-y:auto;background:#10172A;border:1px solid var(--line2);border-bottom:0;border-radius:28px 28px 0 0;padding:12px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .3s cubic-bezier(.2,.8,.2,1) both;display:flex;flex-direction:column;gap:14px}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grab{width:42px;height:4px;border-radius:9px;background:var(--line2);margin:0 auto}
.icon-btn{appearance:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--fg);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}

/* ===== regras de avaliação (heurísticas clássicas de estilo, ajustáveis) ===== */
function hsl(hex){const n=parseInt(hex.slice(1),16),r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let h=0,s=0;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}return{h,s,l}}
const hdiff=(a,b)=>{const d=Math.abs(a-b)%360;return d>180?360-d:d};
function harmonia(L,add){
  const cs=[L.top,L.bottom,L.full,L.outer,L.shoes].filter(Boolean);let s=92;
  const hues=[];cs.filter(p=>!p.neutro).forEach(p=>{const h=hsl(p.cor).h;if(!hues.some(x=>hdiff(x,h)<20))hues.push(h)});
  if(hues.length===0)add('ok','harmonia','Paleta de cores neutras. Combina com facilidade.');
  else if(hues.length===1){s=95;add('ok','harmonia','Uma cor de destaque sobre base neutra deixa o look equilibrado.')}
  else if(hues.length===2){const d=hdiff(hues[0],hues[1]);if(d<40){s=88;add('ok','harmonia','Cores próximas no círculo cromático formam um conjunto harmônico.')}else if(d>=150){s=80;add('info','harmonia','Cores complementares dão contraste forte. Funciona melhor com o resto em tons neutros.')}else{s=68;add('warn','harmonia','Duas cores fortes disputam a atenção.')}}
  else{s=55;add('warn','harmonia','Três ou mais cores fortes deixam o look carregado.')}
  const black=cs.some(p=>p.corNome==='Preto'),brown=cs.some(p=>p.corNome==='Marrom');
  if(black&&brown){s-=8;add('info','harmonia','Preto junto com marrom pede cuidado e costuma funcionar melhor em doses pequenas.')}
  const belt=L.acc.find(p=>p.sub==='cinto');
  if(belt&&L.shoes&&['Preto','Marrom'].includes(belt.corNome)&&['Preto','Marrom'].includes(L.shoes.corNome)&&belt.corNome!==L.shoes.corNome){s-=8;add('warn','harmonia','Cinto e sapato em tons diferentes quebram a regra clássica de manter os dois combinando.')}
  return clamp(s)}
function proporcao(L,add){
  let s=90;
  if(L.full){add('ok','proporcao','O vestido define a silhueta sozinho, sem conflito de volumes.');return s}
  const t=L.top,b=L.bottom;if(!t||!b)return s;
  const vt=['Oversize','Solto','Amplo'].includes(t.corte),vb=['Solto','Amplo'].includes(b.corte);
  if(vt&&vb){s=64;add('warn','proporcao','Volume em cima e embaixo achata a silhueta. Vale deixar um dos lados mais justo.')}
  else if(vt){s=94;add('ok','proporcao','Parte de cima ampla com parte de baixo ajustada cria equilíbrio.')}
  else if(vb){s=88;add('ok','proporcao','Parte de baixo ampla equilibrada por uma parte de cima mais ajustada.')}
  else{s=90;add('ok','proporcao','Modelagens retas e ajustadas mantêm a proporção limpa.')}
  return s}
function estilo(L,add){
  const cs=[L.top,L.bottom,L.full,L.outer,L.shoes].filter(Boolean);if(!cs.length)return 80;
  const f=cs.map(p=>p.formal),sp=Math.max.apply(null,f)-Math.min.apply(null,f);
  let s=sp<=1?95:sp===2?78:56;
  if(sp<=1)add('ok','estilo','As peças falam o mesmo idioma de estilo.');
  else if(sp===2)add('info','estilo','Mistura de níveis de formalidade. Funciona quando é intencional.');
  else add('warn','estilo','As peças estão em níveis de formalidade muito distantes entre si.');
  const es=new Set(cs.map(p=>p.estilo));
  if(es.has('Esportivo')&&(es.has('Elegante')||es.has('Clássico'))){s-=12;add('warn','estilo','Peça esportiva junto de peças clássicas quebra a coerência do conjunto.')}
  return clamp(s)}
const AMB={

function ambiente(L,add){
  const ctx=S.ctx;let s=100,hit=false;
  (AMB[ctx.local]||[]).forEach(r=>{if(r.minR&&ctx.form<r.minR)return;lpieces(L).filter(r.t).forEach(p=>{s-=r.pen;hit=true;add('warn','ambiente',p.nome+' '+r.m+'.')})});
  if(!hit)add('ok','ambiente',ctx.local==='Shopping'?'Shopping não impõe regra própria. O que pesa aqui é o tipo de evento.':'Nada no conjunto destoa de '+ctx.local.toLowerCase()+'.');
  return clamp(s)}
function clima(L,add){
  const wx=S.weather;if(!wx){add('info','clima','Previsão ainda não consultada. Abra Destino para avaliar o clima.');return 80}
  const f=wx.feel,cs=[L.top,L.bottom,L.full,L.outer].filter(Boolean),tot=cs.reduce((a,p)=>a+(p.calor||0),0);
  const T=f>=29?1:f>=18?2:f>=14?3:4,diff=tot-T;let s=100;
  if(f>=24&&diff>0){s-=diff*12;add('warn','clima','Com sensação de '+f+'°C, o conjunto tem camadas demais. Tecidos leves ajudam.')}
  else if(f<18&&diff<0){s-=-diff*14;add('warn','clima','Com sensação de '+f+'°C, falta uma camada. Um casaco ou blazer por cima ajuda.')}
  else{s-=Math.abs(diff)*(f>=18&&f<24?6:0);add('ok','clima','Camadas adequadas para sensação de '+f+'°C.')}
  if(wx.rain>=50&&L.shoes){const pen=(2-(L.shoes.chuva==null?1:L.shoes.chuva))*9;if(pen>0){s-=pen;add('warn','clima',L.shoes.nome+' sofre com chuva. A previsão indica '+wx.rain+'% de chance.')}}
  if(wx.rain>=50&&L.outer&&L.outer.imperm){s=Math.min(100,s+8);add('ok','clima','O casaco impermeável protege da chuva prevista.')}
  else if(wx.rain>=60){s-=6;add('info','clima','Chuva provável. Vale levar guarda-chuva.')}
  return clamp(s)}
function evaluate(L){
  const ctx=S.ctx,R=ctx.form,obrig=!!ctx.obrig,rs=[],add=(tone,area,text)=>rs.push({tone,area,text});
  const h=harmonia(L,add),pr=proporcao(L,add),es=estilo(L,add);
  let oc=100,red=false,yellow=false;
  [L.top,L.bottom,L.full,L.outer,L.shoes].filter(Boolean).forEach(p=>{const d=R-p.formal;
    if((R>=2&&d>=2)||(obrig&&d>=1)){red=true;oc-=30;add('bad','ocasiao',p.nome+' fica abaixo do nível '+FORM[R]+(obrig?' exigido no convite.':' pedido para este evento.'))}
    else if(d>=1){yellow=true;oc-=12;add('warn','ocasiao',p.nome+' é um pouco mais casual do que o nível '+FORM[R]+'.')}
    else if(R===0&&p.formal>=3){yellow=true;oc-=8;add('warn','ocasiao',p.nome+' pode ficar formal demais para um evento casual.')}});
  L.acc.forEach(p=>{if(R>=2&&p.formal<=0){yellow=true;oc-=6;add('warn','ocasiao',p.nome+' não acompanha o nível '+FORM[R]+'.')}});
  if(!red&&!yellow)add('ok','ocasiao','As peças atendem ao nível '+FORM[R]+' pedido para '+ctx.ocasiao.toLowerCase()+'.');
  oc=clamp(oc);if(red)oc=Math.min(oc,30);
  const amb=ambiente(L,add),cl=clima(L,add);
  let total=rnd(h*.18+pr*.14+es*.14+oc*.26+amb*.10+cl*.18);
  const flag=(red||amb<55)?'vermelho':(yellow||amb<80||cl<72)?'amarelo':'verde';
  let capped=false;if(flag==='vermelho'&&total>54){total=54;capped=true}
  const ord={bad:0,warn:1,info:2,ok:3};
  rs.sort((a,b)=>ord[a.tone]-ord[b.tone]);
  return{total,flag,capped,crit:{harmonia:h,proporcao:pr,estilo:es,ocasiao:oc,ambiente:amb,clima:cl},reasons:rs.slice(0,8)}}

function sig(){return JSON.stringify([S.ctx,S.weather,closet().map(p=>p.id)])}
let _c={sig:'',list:[]};
function ranked(){
  const sg=sig();if(_c.sig===sg)return _c.list;
  const C=closet(),g=s=>C.filter(p=>slotOf(p)===s),accs=g('acc');

 favUse(t){const f=S.favs.find(x=>x.key===t.dataset.key);if(!f)return;f.uso++;f.ids.forEach(id=>{S.usage[id]=(S.usage[id]||0)+1});L_.save();render();toast('Uso registrado nas peças do look.')},
 favDel(t){S.favs=S.favs.filter(x=>x.key!==t.dataset.key);S.cmp=S.cmp.filter(k=>k!==t.dataset.key);L_.save();render()},
 favCmp(t){const k=t.dataset.key,i=S.cmp.indexOf(k);if(i>=0)S.cmp.splice(i,1);else{if(S.cmp.length>=2)S.cmp.shift();S.cmp.push(k)}render()},
 favCompare(){const a=S.favs.find(x=>x.key===S.cmp[0]),b=S.favs.find(x=>x.key===S.cmp[1]);if(a&&b)openSheet('Comparar looks',compareSheet(a,b))}
};
document.addEventListener('click',e=>{if(e.target.id==='overlay'){closeSheet();return}const t=e.target.closest('[data-act]');if(!t)return;const f=A[t.dataset.act];if(f)f(t,e)});
document.addEventListener('input',e=>{const t=e.target;if(!t.dataset||!t.dataset.bind)return;let v=t.value;if(t.type==='number')v=v===''?0:Number(v);if(t.dataset.int)v=parseInt(v,10);L_.setPath(t.dataset.bind,v);
  if(t.dataset.bind.indexOf('weather.')===0){S.weather.sample=false;S.weather.manual=true;const a=$('#adapt');if(a)a.innerHTML=L_.adaptHTML()}L_.save()});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.rerender==='add')refreshSheetAdd();
  if(t.id==='photoInput'&&t.files[0])readImage(t.files[0]).then(r=>{const d=S.draft,f=t.files[0].name;d.foto=r.data;d.corNome=nearest(r.rgb);const g=guess(f);if(g){d.cat=g;d.formal=({camiseta:0,social:2,calca:1,bermuda:0,vestido:2,jaqueta:1,tenis:0,sapato:3,acessorio:1})[g];d.sub=''}if(!d.nome)d.nome=f.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ');refreshSheetAdd()}).catch(()=>toast('Não consegui ler essa imagem.'));
  if(t.id==='evalPhoto'&&t.files[0])readImage(t.files[0]).then(r=>{S.av.photo=r.data;renderBody()}).catch(()=>toast('Não consegui ler essa imagem.'))});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#overlay').hidden){closeSheet();return}if(S.tab==='match'&&S.mode==='descobrir'&&$('#overlay').hidden&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){if(e.key==='ArrowRight')fling('like');if(e.key==='ArrowLeft')fling('nope')}});

/* ===== leitura de imagem: cor dominante real, o restante é sugestão ===== */
const GUESS=[['social',/social/i],['camiseta',/camiset|t-?shirt|blusa|regata|polo/i],['social',/camisa/i],['calca',/cal[cç]a|jeans|chino|pants/i],['bermuda',/bermuda|short/i],['vestido',/vestido|saia|dress|skirt/i],['jaqueta',/jaqueta|casaco|blazer|jacket|coat|moletom/i],['tenis',/t[eê]nis|sneaker/i],['sapato',/sapato|oxford|derby|loafer|mocassim/i],['acessorio',/rel[oó]gio|cinto|bon[eé]|bolsa|[oó]culos|watch|belt/i]];
function guess(n){const g=GUESS.find(x=>x[1].test(n));return g?g[0]:null}
function nearest(rgb){let best=null,bd=1e9;L_.COLORS.forEach(c=>{const n=parseInt(c[1].slice(1),16),r=n>>16&255,g=n>>8&255,b=n&255,d=Math.pow(r-rgb[0],2)*.3+Math.pow(g-rgb[1],2)*.59+Math.pow(b-rgb[2],2)*.11;if(d<bd){bd=d;best=c[0]}});return best}
function readImage(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,260/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*k)),h=Math.max(1,Math.round(img.height*k)),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(img,0,0,w,h);
  const cx=Math.round(w*.25),cy=Math.round(h*.25),cw=Math.max(1,Math.round(w*.5)),ch=Math.max(1,Math.round(h*.5)),d=x.getImageData(cx,cy,cw,ch).data;let r=0,g=0,b=0,n=0;for(let i=0;i<d.length;i+=16){r+=d[i];g+=d[i+1];b+=d[i+2];n++}
  res({data:c.toDataURL('image/jpeg',.72),rgb:[r/n,g/n,b/n]})};img.onerror=rej;img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

buildTabs();render();
})();
</script>
